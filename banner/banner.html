<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ana Sayfa Banner</title>
<style>
  /* ===== DEĞİŞTİRİLEBİLİR AYARLAR ===== */
  :root {
    --bg-1: #0f1b3d;       /* arka plan koyu ton */
    --bg-2: #3b1d5e;       /* arka plan ikinci ton */
    --accent: #ffcc4d;     /* vurgu rengi (indirim, buton) */
    --text: #ffffff;
    --muted: #c9d1f0;
    --font: "Inter", "Inter Display", system-ui, sans-serif;
  }
  /* ==================================== */

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9ebf2; font-family: var(--font); padding: 40px; display: grid; gap: 40px; justify-items: start; }
  .label { font: 600 14px var(--font); color: #556; }

  .banner {
    position: relative; overflow: hidden; color: var(--text);
    background:
      radial-gradient(circle at 85% 30%, rgba(255,204,77,.18), transparent 40%),
      radial-gradient(circle at 10% 110%, rgba(140,120,255,.35), transparent 45%),
      linear-gradient(120deg, var(--bg-1), var(--bg-2));
  }
  .banner .flake { position: absolute; color: rgba(255,255,255,.12); }
  .eyebrow { display: inline-block; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
             color: var(--accent); border: 2px solid rgba(255,204,77,.5); border-radius: 999px; }
  .title { font-family: "Inter Display", var(--font); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .title em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); font-weight: 400; }
  .cta { display: inline-flex; align-items: center; gap: .5em; background: var(--accent); color: #1a1430;
         font-weight: 700; border-radius: 999px; text-decoration: none; }
  .badge { position: absolute; display: grid; place-items: center; text-align: center; border-radius: 50%;
           background: var(--accent); color: #1a1430; font-family: "Inter Display", var(--font); font-weight: 900;
           box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .badge small { display: block; font-weight: 700; letter-spacing: .08em; }

  /* Masaüstü 1920x600 */
  .desktop { width: 1920px; height: 600px; padding: 0 180px; display: flex; align-items: center; }
  .desktop .content { max-width: 1000px; }
  .desktop .eyebrow { font-size: 20px; padding: 10px 24px; margin-bottom: 28px; }
  .desktop .title { font-size: 120px; margin-bottom: 24px; }
  .desktop .sub { font-size: 30px; margin-bottom: 44px; }
  .desktop .cta { font-size: 26px; padding: 22px 46px; }
  .desktop .badge { width: 340px; height: 340px; right: 260px; top: 130px; font-size: 120px; transform: rotate(-8deg); }
  .desktop .badge small { font-size: 24px; margin-top: 6px; }

  /* Mobil 800x1000 */
  .mobile { width: 800px; height: 1000px; padding: 90px 70px; display: flex; flex-direction: column; justify-content: flex-end; }
  .mobile .eyebrow { font-size: 20px; padding: 10px 22px; margin-bottom: 26px; align-self: flex-start; }
  .mobile .title { font-size: 104px; margin-bottom: 22px; }
  .mobile .sub { font-size: 30px; margin-bottom: 40px; }
  .mobile .cta { font-size: 28px; padding: 24px 46px; align-self: flex-start; }
  .mobile .badge { width: 300px; height: 300px; right: 70px; top: 90px; font-size: 104px; transform: rotate(-8deg); }
  .mobile .badge small { font-size: 22px; margin-top: 4px; }
</style>
</head>
<body>

<p class="label">Masaüstü — 1920 × 600</p>
<section class="banner desktop" id="desktop">
  <svg class="flake" style="left:1180px;top:-40px" width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg>
  <svg class="flake" style="left:1720px;top:470px" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg>
  <div class="content">
    <span class="eyebrow">Sınırlı Süre</span>
    <h1 class="title">Kış <em>İndirimi</em></h1>
    <p class="sub">Seçili ürünlerde büyük fırsatlar · 500 TL üzeri kargo bedava</p>
    <a class="cta" href="#">Alışverişe Başla →</a>
  </div>
  <div class="badge"><div>%30<small>İNDİRİM</small></div></div>
</section>

<p class="label">Mobil — 800 × 1000</p>
<section class="banner mobile" id="mobile">
  <svg class="flake" style="left:560px;top:520px" width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg>
  <span class="eyebrow">Sınırlı Süre</span>
  <h1 class="title">Kış<br><em>İndirimi</em></h1>
  <p class="sub">Seçili ürünlerde büyük fırsatlar<br>500 TL üzeri kargo bedava</p>
  <a class="cta" href="#">Alışverişe Başla →</a>
  <div class="badge"><div>%30<small>İNDİRİM</small></div></div>
</section>

</body>
</html>
