<!-- ACARRAF Şaka: Logoya tıklanınca "raf" devrilir. Logo animasyonu kodunun ALTINA ekleyin.
     Şimdilik SADECE deneme modunda çalışır: acarraf.com/?troll=1 ile açın (kapatmak için ?troll=0). -->
<style>
  .acr-devrik { position: fixed; z-index: 100000; pointer-events: none; background-size: 100% 100%; background-repeat: no-repeat; will-change: transform; }
  .acr-bum { position: fixed; z-index: 100001; pointer-events: none; font: 900 34px/1 "Roboto", Arial, sans-serif; color: #e8711c;
             text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(0,0,0,.25); }
  .acr-mesaj { position: fixed; z-index: 100002; background: #1d2023; color: #fff; font: 600 15px/1.35 "Roboto", Arial, sans-serif;
               padding: 12px 18px; border-radius: 12px; border-left: 4px solid #e8711c; box-shadow: 0 10px 30px rgba(0,0,0,.25);
               max-width: calc(100vw - 32px); }
  .acr-mesaj::before { content: ""; position: absolute; top: -8px; left: var(--ok, 28px); border: 8px solid transparent; border-top: 0; border-bottom-color: #1d2023; }
</style>
<script>
(function () {
  try {
    var q = location.search;
    if (/[?&]troll=1/.test(q)) sessionStorage.setItem('acrTroll', '1');
    if (/[?&]troll=0/.test(q)) sessionStorage.removeItem('acrTroll');
    if (sessionStorage.getItem('acrTroll') !== '1') return;   // deneme modu kapalıysa hiçbir şey yapma
  } catch (e) { return; }

  var calisiyor = false;

  function oyna(link) {
    var raf = link.querySelector('.acr-logo-katman .acr-raf');
    var acar = link.querySelector('.acr-logo-katman .acr-acar');
    if (!raf || calisiyor) return;
    calisiyor = true;

    var r = raf.getBoundingClientRect();
    var kopya = document.createElement('div');
    kopya.className = 'acr-devrik';
    kopya.style.cssText = 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;background-image:' + getComputedStyle(raf).backgroundImage;
    document.body.appendChild(kopya);
    raf.style.visibility = 'hidden';

    var dy = window.innerHeight - r.bottom - 6;      // ekranın altına kadar mesafe
    var dx = window.innerWidth - r.left + 40;        // sağdan çıkış mesafesi

    // 1) sallan, devril, düş, zıpla, yuvarlanıp çık
    var dus = kopya.animate([
      { transform: 'none', offset: 0 },
      { transform: 'rotate(-9deg)', offset: .07 },
      { transform: 'rotate(11deg)', offset: .14 },
      { transform: 'rotate(-7deg)', offset: .21 },
      { transform: 'translate(8px, 4px) rotate(48deg)', offset: .32, easing: 'cubic-bezier(.5,0,1,.6)' },
      { transform: 'translate(36px,' + dy + 'px) rotate(180deg)', offset: .52, easing: 'cubic-bezier(0,.4,.5,1)' },
      { transform: 'translate(70px,' + (dy - 70) + 'px) rotate(230deg)', offset: .60, easing: 'cubic-bezier(.5,0,1,.6)' },
      { transform: 'translate(100px,' + dy + 'px) rotate(270deg)', offset: .68, easing: 'cubic-bezier(0,.4,.5,1)' },
      { transform: 'translate(120px,' + (dy - 18) + 'px) rotate(290deg)', offset: .73 },
      { transform: 'translate(140px,' + dy + 'px) rotate(310deg)', offset: .78, easing: 'ease-in' },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(1080deg)', offset: 1 }
    ], { duration: 3400, fill: 'forwards' });

    // "acar" irkilsin
    if (acar) acar.animate([{ transform: 'none' }, { transform: 'translateY(-10%) rotate(-3deg)' }, { transform: 'rotate(2deg)' }, { transform: 'none' }],
                           { duration: 500, delay: 900, easing: 'ease-out' });

    // yere çarpınca BUM
    setTimeout(function () {
      var b = document.createElement('div'); b.className = 'acr-bum'; b.textContent = 'BUM!';
      b.style.left = (r.left + 20) + 'px'; b.style.top = (window.innerHeight - 70) + 'px';
      document.body.appendChild(b);
      b.animate([{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1.3) rotate(-8deg)', opacity: 1, offset: .3 }, { transform: 'translateY(-30px) scale(1)', opacity: 0 }],
                { duration: 900, easing: 'ease-out' }).onfinish = function () { b.remove(); };
    }, 3400 * .52);

    // 2) geri gel, yerine otur, mesaj ver
    dus.onfinish = function () {
      setTimeout(function () {
        kopya.getAnimations().forEach(function (a) { a.cancel(); });
        var geri = kopya.animate([
          { transform: 'translateY(-' + (r.bottom + 60) + 'px)', offset: 0 },
          { transform: 'translateY(0) scale(1.15,.7)', offset: .45, easing: 'ease-out' },
          { transform: 'translateY(-30%) scale(.94,1.1)', offset: .62 },
          { transform: 'translateY(0) scale(1.06,.88)', offset: .78 },
          { transform: 'none', offset: 1 }
        ], { duration: 1100, easing: 'ease-in' });
        geri.onfinish = function () {
          raf.style.visibility = ''; kopya.remove(); calisiyor = false;
          mesaj(link);
        };
      }, 700);
    };
  }

  function mesaj(link) {
    var lr = link.getBoundingClientRect();
    var m = document.createElement('div');
    m.className = 'acr-mesaj';
    m.textContent = 'Merak etme, bizim raflar bu kadar kolay devrilmez 😄';
    m.style.top = (lr.bottom + 12) + 'px';
    document.body.appendChild(m);
    var sol = Math.max(16, Math.min(lr.left, window.innerWidth - m.offsetWidth - 16));   // ekrandan taşmasın
    m.style.left = sol + 'px';
    m.style.setProperty('--ok', Math.max(14, lr.left + 20 - sol) + 'px');
    m.animate([{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 300, fill: 'forwards' });
    setTimeout(function () {
      m.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).onfinish = function () { m.remove(); };
    }, 4000);
  }

  document.addEventListener('click', function (e) {
    var link = e.target.closest && e.target.closest('#hb-logo a');
    if (!link || !link.querySelector('.acr-logo-katman')) return;
    e.preventDefault();          // deneme modunda logo ana sayfaya gitmez, şakayı oynatır
    oyna(link);
  }, true);
})();
</script>
