<script>
(function () {
  function kur(img) {
    if (img.getAttribute('data-acr-anim')) return;
    var a = img.parentElement; if (!a) return;
    img.setAttribute('data-acr-anim', '1');
    if (getComputedStyle(a).position === 'static') a.style.position = 'relative';
    var k = document.createElement('span');

    k.innerHTML = '<i class="acr-raf"></i><i class="acr-acar"></i><i class="acr-parilti"></i>';
    function yerlestir() {

      k.style.width = img.offsetWidth + 'px'; k.style.height = img.offsetHeight + 'px';
    }
    a.appendChild(k); yerlestir();
    img.style.opacity = '0';
    img.addEventListener('load', yerlestir);
    window.addEventListener('resize', yerlestir);
    setTimeout(yerlestir, 600);
  }
  function basla() { var l = document.querySelectorAll('#hb-logo img.header-logo, img.header_logo'); for (var i = 0; i < l.length; i++) kur(l[i]); }
